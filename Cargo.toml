[workspace]
resolver = "2"
members = [
    "crates/graftx-protocol",
    "crates/graftx-handles",
    "crates/graftx-transport",
    "crates/graftx-client",
    "crates/graftx-server",
    "crates/graftx-obs",
    "crates/graftx-cli",
    "crates/graftx-xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Kim DaeHyun <kernalix7@kodenet.io>"]
repository = "https://github.com/kernalix7/graftx"

[workspace.dependencies]
graftx-protocol = { path = "crates/graftx-protocol" }
graftx-handles = { path = "crates/graftx-handles" }
graftx-transport = { path = "crates/graftx-transport" }
graftx-obs = { path = "crates/graftx-obs" }
thiserror = "2"
tracing = "0.1"
